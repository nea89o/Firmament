name: Build
on:
    - push
    - pull_request

permissions:
    pull-requests: write

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
                name: Checkout repository
                with:
                    fetch-tags: true
                    fetch-depth: 0
                    filter: 'tree:0'
            -   uses: ./.github/composite/gradle
            -   name: Build with gradle
                run: |
                    ./gradlew assemble --scan
            -   name: Move build artifact around and print check sum
                run: |
                    rm -f build/libs/*sources*.jar build/libs/*-api.jar
                    sha256sum build/libs/*.jar
            -   name: Upload build artifact
                uses: actions/upload-artifact@v4
                with:
                    name: built-mod-jar
                    path: build/libs/Firmament-*.jar
                    exclude: |
                        build/libs/*-sources.jar
                        build/libs/*-api.jar

    test:
        name: Test
        needs: build
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
                name: Checkout repository
                with:
                    fetch-tags: true
                    fetch-depth: 0
                    filter: 'tree:0'
            -   uses: ./.github/composite/gradle
            -   name: Build with gradle
                run: |
                    ./gradlew test --scan

    prepare-release:
        name: Prepare a release
        runs-on: ubuntu-22.04
        needs: build
        permissions:
            contents: write
        if: ${{ 'push' == github.event_name && startsWith(github.ref, 'refs/tags/') }}
        steps:
            -   uses: actions/checkout@v5
                name: Checkout repository
                with:
                    fetch-tags: true
                    fetch-depth: 0
                    filter: 'tree:0'

            -   name: Download generated artifact
                uses: actions/download-artifact@v5
                with:
                    name: built-mod-jar
            -   name: Generate changelog
                run: ./docs/generate-changelog.sh > changelog.md

            -   name: Upload release
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    gh release create --draft -t "Firmament ${{ github.ref_name }}" "${{ github.ref_name }}" -F "changelog.md" "*.jar"
